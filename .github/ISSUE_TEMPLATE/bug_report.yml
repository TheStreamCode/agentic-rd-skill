name: Bug report
description: Report a problem with the skill package, workflow state, or CLI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Include `npm run check`, `rd.mjs status --json`, `rd.mjs validate --json`, or host activation output when relevant. Redact secrets.
    validations:
      required: false
  - type: input
    id: workflow_version
    attributes:
      label: Workflow and CLI version
      description: Record the workflowVersion from run-state.json and the installed skill version when known.
      placeholder: workflow 1.1, skill x.y.z
    validations:
      required: false
  - type: dropdown
    id: mutation
    attributes:
      label: Did the failing command modify state or artifacts?
      options:
        - "No"
        - "Yes"
        - "Unknown"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js version, host CLI and version, installation path, and reproduction steps.
    validations:
      required: true
