name: Bug report
description: Report a problem with the skill package, workflow state, or CLI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Include `npm test`, `rd.mjs validate`, or host activation output when relevant. Redact secrets.
    validations:
      required: false
