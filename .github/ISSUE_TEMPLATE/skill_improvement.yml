name: Skill improvement
description: Suggest an improvement to the workflow, references, templates, or CLI.
title: "[Improvement]: "
labels:
  - enhancement
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this useful?
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility notes
      description: Describe workflow versions read/written, host impact, migration needs, and whether existing runs remain usable.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and validation notes
      description: Which authorization boundaries, failure modes, deterministic checks, and documentation surfaces need to change?
    validations:
      required: false
