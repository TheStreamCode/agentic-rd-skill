name: Documentation
description: Report unclear or missing documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: issue
    attributes:
      label: Documentation issue
      description: What is unclear or missing?
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: Relevant file
      placeholder: README.md, AGENTS.md, RELEASING.md, skills/agentic-rd-skill/SKILL.md, references/workflow.md
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Suggested clarification
      description: What behavior, example, version, or evidence date should the documentation state?
    validations:
      required: false
